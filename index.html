  function creatorPage() { const p=model.profile;return `<section class="stp-page stp-dark-page">${bar('创造角色','填写你在星灯公寓的入住档案')}<div class="stp-scroll stp-pad"><form id="creatorForm" data-form="creator"><div class="stp-fields"><label class="stp-field"><span>希望大家使用的称呼 *</span><input name="name" required maxlength="24" value="${esc(p.name)}" placeholder="输入你的称呼" autocomplete="nickname"></label><label class="stp-field"><span>代词 / 性别（可不填写）</span><input name="pronouns" maxlength="24" value="${esc(p.pronouns==='未提供'?'':p.pronouns)}" placeholder="例如：她、他，或只用我的名字"></label><label class="stp-field"><span>身份、爱好与相处偏好（可选）</span><textarea name="identity" maxlength="140" placeholder="只填写你愿意告诉居民的事">${esc(p.identity)}</textarea></label><label class="stp-field"><span>故事里的画法</span><select name="mode">${modes.map(m=>`<option value="${m}" ${p.mode===m?'selected':''}>${m==='adult'?'成年比例版':'Q版'}</option>`).join('')}</select></label></div><hr class="stp-divider"><h3 class="stp-section-title">选择一条故事线 *</h3><div class="stp-route-list">${routes.map(r=>`<label class="stp-route"><input type="radio" name="route" value="${r.id}" ${p.route===r.id?'checked':''} required><div><strong>${r.name}</strong><p>${r.brief}</p></div></label>`).join('')}</div><p class="stp-muted">四条线都允许AI娘彼此发展百合。多人恋爱按各人的意愿慢慢商量；选择线路不会让全员立刻爱上你。</p><div class="stp-fields"><label class="stp-field"><span>第一个联系的居民</span><select name="first">${D.characters.map(c=>`<option value="${c.id}" ${p.first===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="stp-field"><span>第一条消息</span><textarea name="opening" maxlength="500">${esc(p.opening)}</textarea></label></div><label class="stp-check"><input type="checkbox" name="adult" required checked>我创建的是成年入住角色</label><button type="submit" class="stp-primary">生成入住开局指令</button><button type="button" class="stp-secondary" data-action="switchRoute" style="margin-top:10px">已有剧情：只生成切线指令</button><p class="stp-muted">档案先保存于手机。把指令发到 TalkAI 后，角色设定和线路才进入真实剧情。</p></form></div></section>`; }
  function settingsPage() { const p=model.phoneWallpaper;return `<section class="stp-page stp-dark-page">${bar('设置','壁纸与手机偏好')}<div class="stp-scroll stp-pad"><h3 class="stp-section-title">手机壁纸</h3><div class="stp-setting-row"><span>${esc(character(p.id).label)} · ${D.states[p.pose]}<small>${p.mode==='adult'?'成年比例版':'Q版'} · 同时用于锁屏和桌面</small></span><button data-action="wallpaperPicker">更换</button></div><button class="stp-secondary" data-action="lock">锁屏，预览来消息效果</button><h3 class="stp-section-title" style="margin-top:22px">各应用聊天壁纸</h3>${D.characters.map(c=>`<div class="stp-setting-row"><span>${esc(c.label)}<small>${D.states[model.appWallpapers[c.id].pose]} · ${model.appWallpapers[c.id].mode==='adult'?'成年比例':'Q版'}</small></span><button data-action="gallery" data-id="${c.id}">图鉴中更换</button></div>`).join('')}<hr class="stp-divider"><h3 class="stp-section-title">入住档案与配置</h3><div class="stp-setting-row"><span>${esc(model.profile.name||'尚未填写称呼')}<small>${esc(route(model.profile.route)?.name||'故事线待选择')}</small></span><button data-action="creator">编辑</button></div><p class="stp-muted">${storeMode==='local'?'当前浏览器可保存壁纸、档案和草稿。':'当前宿主使用隔离沙盒，设置暂存于本次页面；离开前可以导出配置。'}导出文件只含你的界面偏好，不含图片或模型对话。</p><div class="stp-photo-actions"><button class="stp-secondary" data-action="exportConfig">导出手机配置</button><button class="stp-secondary" data-action="importConfig">导入手机配置</button></div><p class="stp-muted">图片来自公开HTTPS文件。手机页不读取密钥，也不采集你的档案。AI真实剧情在 TalkAI 继续。</p></div></section>`; }
  function wallpaperPicker() { return `<section class="stp-page stp-dark-page">${bar('选择手机壁纸','先选居民，再从图鉴选一张')}<div class="stp-scroll stp-pad"><div class="stp-picker-grid">${D.characters.map(c=>`<button class="stp-pick" data-action="gallery" data-id="${c.id}">${icon(c)}<span>${esc(c.label)}<i>24张图鉴</i></span></button>`).join('')}</div></div></section>`; }
  function splitPickerPage() { const order=[...model.recent,...ids.filter(x=>!model.recent.includes(x))];return `<section class="stp-page stp-dark-page">${bar('分屏','选择两个不同应用，上下同时查看')}<div class="stp-scroll stp-pad"><p class="stp-muted">${splitChoices.length===0?'先选上半屏的应用。':splitChoices.length===1?'再选下半屏的应用。':'两个应用已选好，可以开始分屏。'}</p><div class="stp-picker-grid">${order.map(id=>{const c=character(id),n=splitChoices.indexOf(id);return `<button class="stp-pick ${n>=0?'selected':''}" data-action="pickSplit" data-id="${id}" aria-pressed="${n>=0}">${icon(c)}<span>${esc(c.label)}<i>${n===0?'上半屏':n===1?'下半屏':model.recent.includes(id)?'最近打开':'未打开'}</i></span></button>`;}).join('')}</div><button class="stp-primary" style="margin-top:18px" data-action="startSplit" ${splitChoices.length===2?'':'disabled'}>开启分屏</button><p class="stp-muted">两个面板各自保留壁纸、草稿和图鉴入口。生成聊天指令时仍分别联系对应居民。</p></div></section>`; }
  function splitPage() { return `<section class="stp-split" aria-label="上下双应用分屏">${chatPane(view.top,true)}<div class="stp-split-divider"><span>双应用分屏 · 私聊各自独立</span><button data-action="swapSplit">交换 ↕</button><button data-action="splitPicker">重选</button></div>${chatPane(view.bottom,true)}</section>`; }
  const leisure = window.createStarlightEntertainment({data:D,esc,bar,cg,character,getView:()=>view,navigate,toast});
  const imageTimers = new WeakMap();
  function remoteAlternatives(url) {
    const match=/^https:\/\/[^/]*jsdelivr\.net\/gh\/([^@]+)@([^/]+)\/(.*)$/.exec(url);
    return match ? [url,`https://cdn.jsdelivr.net/gh/${match[1]}@${match[2]}/${match[3]}`,`https://raw.githubusercontent.com/${match[1]}/${match[2]}/${match[3]}`] : [url];
  }
  function watchImages() {
    document.querySelectorAll('#screen img').forEach(img=>{
      if(img.complete && img.naturalWidth>0 || imageTimers.has(img)) return;
      // 懒加载图只在进入视口后才开始计时，不把未滚到的图误判为失败。
      const observer=new IntersectionObserver(entries=>{
        if(!entries.some(e=>e.isIntersecting))return;observer.disconnect();
        imageTimers.set(img,setTimeout(()=>{if(img.isConnected && !img.naturalWidth)retryImage(img);},10000));
      });observer.observe(img);imageTimers.set(img,null);
    });
  }
  function retryImage(img) {
    clearTimeout(imageTimers.get(img));
    const original=img.dataset.originalSource || img.src;img.dataset.originalSource=original;
    const urls=remoteAlternatives(original),attempt=Number(img.dataset.retry || '0')+1;
    if(attempt<urls.length){img.dataset.retry=String(attempt);img.classList.add('stp-image-retrying');img.src=urls[attempt];imageTimers.set(img,setTimeout(()=>{if(img.isConnected && !img.naturalWidth)retryImage(img);},10000));return;}
    img.classList.remove('stp-image-retrying');img.classList.add('stp-image-failed');if(!img.alt.includes('暂时无法加载'))img.alt+='（图片暂时无法加载）';
  }
  function watchBackground(el,url) {
    const urls=remoteAlternatives(url),key=url;el.dataset.backgroundRequest=key;
    let attempt=0,timer;
    function load(){if(!el.isConnected || el.dataset.backgroundRequest!==key)return;const img=new Image();
      let settled=false;const next=()=>{if(settled)return;settled=true;clearTimeout(timer);if(++attempt<urls.length)load();};
      img.onload=()=>{if(settled)return;settled=true;clearTimeout(timer);if(el.isConnected && el.dataset.backgroundRequest===key)el.style.backgroundImage=`url("${urls[attempt]}")`;};img.onerror=next;img.src=urls[attempt];timer=setTimeout(next,10000);
    }load();
  }
  function render() {
    leisure.unmount();
    const map={lock:lockPage,home:homePage,chat:()=>chatPane(view.id),gallery:galleryPage,photo:photoPage,inbox:inboxPage,creator:creatorPage,settings:settingsPage,wallpaperPicker,splitPicker:splitPickerPage,split:splitPage,music:leisure.musicPage,games:leisure.gamesPage,game:leisure.gamePage};
    $('#screen').innerHTML=(map[view.page] || homePage)();
    const p=(view.page==='chat'?model.appWallpapers[view.id]:model.phoneWallpaper);
    $('#wallpaper').style.backgroundImage=`url("${wallpaperUrl(p)}")`;
    watchBackground($('#wallpaper'),wallpaperUrl(p));
    document.querySelectorAll('.stp-chat').forEach(el=>watchBackground(el,wallpaperUrl(model.appWallpapers[el.dataset.chat])));
    watchImages();
    $('.stp-phone').dataset.page=view.page;tick();leisure.mount(view);
  }
  function tick() { const t='18:42';$('#statusTime').textContent=t;document.querySelectorAll('.stp-live-clock').forEach(el=>el.textContent=t); }
  function collectProfile() {
    const form=$('#creatorForm');if(!form || !form.reportValidity()) return null;
    const values=new FormData(form);return {name:String(values.get('name')||'').trim().slice(0,24),pronouns:String(values.get('pronouns')||'').trim().slice(0,24)||'未提供',identity:String(values.get('identity')||'').trim().slice(0,140),mode:String(values.get('mode')),route:String(values.get('route')),first:String(values.get('first')),opening:String(values.get('opening')||'').trim().slice(0,500),adult:values.get('adult')==='on'};
  }
  function startupPacket(p) { const r=route(p.route),c=character(p.first);return `[星灯开局]\n线路=${p.route}（${r.name.replace(/^. · /,'')}）\n用户主动攻略=${r.user?'允许':'不主动'}；AI娘主动攻略用户=${r.ai?'允许':'不允许'}\nAI娘之间百合=允许自主发展\n称呼=${p.name}\n代词或性别=${p.pronouns}\n年龄身份=成年人\n身份与爱好=${p.identity||'未提供'}\n画法=${p.mode==='adult'?'成年比例版':'Q版'}\n首个联系对象=${c.name}\n初始情境=入住第1天傍晚，我的手机收到八位居民的普通迎新消息。承接${c.name}的迎新私聊。\n我的第一条消息：${p.opening||'你好。'}\n请先确认线路，再接续真实剧情。不要替我决定动作和感情，也不要让所有居民开局就爱上我。`;
  }
  function showPacket(text,title='带入 TalkAI 对话') { lastFocus=document.activeElement;$('#packetTitle').textContent=title;$('#packetText').value=text;$('#copyStatus').textContent='';$('#packetModal').hidden=false;$('#packetText').focus();$('#packetText').setSelectionRange(0,0); }
  function closePacket() { $('#packetModal').hidden=true;if(lastFocus?.isConnected)lastFocus.focus(); }
  async function copyPacket() {
    const field=$('#packetText');let copied=false;
    if(navigator.clipboard?.writeText) try {await navigator.clipboard.writeText(field.value);copied=true;} catch(error) {copied=false;}
    if(!copied) {field.focus();field.select();try{copied=document.execCommand('copy');}catch(error){copied=false;}}
    $('#copyStatus').textContent=copied?'已复制。回到 TalkAI 输入框粘贴并发送即可。':'自动复制受浏览器限制。文字已选中，长按或按 Ctrl+C 复制。';
  }
  function prepareChat(id) { const text=model.drafts[id].trim();if(!text){toast('先写下想对她说的话。');return;}if(!route(model.profile.route) || !model.profile.name){toast('先创建你的入住角色，选择故事线。');model.profile.first=id;persist();navigate({page:'creator'});return;}showPacket(`[星灯私聊]\n对象=${character(id).name}\n玩家称呼=${model.profile.name}\n界面所选线路=${model.profile.route}；已有剧情沿用已确认线路，勿因这条私聊偷偷切线。\n我的消息：${text}\n请仅让这位居民回应；其余人不会自动知道私聊。`,'给'+character(id).label+'的聊天指令'); }
  function exportConfig() { const file=new Blob([JSON.stringify(model,null,2)],{type:'application/json'}),url=URL.createObjectURL(file),link=document.createElement('a');link.href=url;link.download='星灯手机配置.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('手机配置已导出。'); }
  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-action]');if(!button || button.disabled)return;
    const action=button.dataset.action,id=button.dataset.id;
    if(leisure.action(action,button))return;
    if(action==='back')return back();if(action==='home')return home();
    if(action==='unlock')return unlock();if(action==='unlockChat')return unlock(id);
    if(action==='chat')return openChat(id);
    if(action==='gallery')return navigate({page:'gallery',id,mode:'adult'});
    if(action==='galleryMode'){view.mode=button.dataset.mode;return render();}
    if(action==='photo')return navigate({page:'photo',id,mode:button.dataset.mode,pose:button.dataset.pose});
    if(action==='setPhoneWallpaper'){model.phoneWallpaper=selection(view.id,view.mode,view.pose);persist();render();return toast('已设为手机锁屏与桌面壁纸。');}
    if(action==='setAppWallpaper'){model.appWallpapers[view.id]=selection(view.id,view.mode,view.pose);persist();return toast('已更换'+character(view.id).label+'聊天壁纸。');}
    if(action==='showImageUrl')return showPacket(cg(view.id,view.mode,view.pose),'公开原图地址');
    if(['inbox','settings','creator','wallpaperPicker','music','games'].includes(action))return navigate({page:action});
    if(action==='lock'){history=[];return navigate({page:'lock'},false);}
    if(action==='splitPicker'){if(view.page==='lock')return toast('先解锁手机，再打开分屏。');splitChoices=view.page==='split'?[view.top,view.bottom]:[];return navigate({page:'splitPicker'});}
    if(action==='pickSplit'){if(splitChoices.includes(id))splitChoices=splitChoices.filter(x=>x!==id);else if(splitChoices.length<2)splitChoices.push(id);else return toast('最多两个应用，先取消一个再选择。');return render();}
    if(action==='startSplit' && splitChoices.length===2){for(const cid of splitChoices){model.read=[...new Set([...model.read,cid])];model.recent=[cid,...model.recent.filter(x=>x!==cid)].slice(0,8);}persist();return navigate({page:'split',top:splitChoices[0],bottom:splitChoices[1]});}
    if(action==='swapSplit'){[view.top,view.bottom]=[view.bottom,view.top];return render();}
    if(action==='copyPacket')return copyPacket();if(action==='closePacket')return closePacket();
    if(action==='exportConfig')return exportConfig();if(action==='importConfig')return $('#configImport').click();
    if(action==='switchRoute'){const p=collectProfile();if(!p)return;model.profile=p;persist();return showPacket(`[星灯切线]\n线路=${p.route}（${route(p.route).name}）\n保留已发生的关系、拒绝与承诺。请确认新的主动权限；若切百合旁观线，先和我商量原有恋爱如何处理。`,'切换故事线');}
  });
  document.addEventListener('submit',event=>{const form=event.target;if(!form.matches('[data-form]'))return;event.preventDefault();if(form.dataset.form==='chat')return prepareChat(form.dataset.id);if(form.dataset.form==='creator'){const p=collectProfile();if(!p || !p.name || !route(p.route))return;model.profile=p;persist();showPacket(startupPacket(p),'入住开局指令');}});
  document.addEventListener('input',event=>{leisure.input(event.target);const id=event.target.dataset.draft;if(ids.includes(id)){model.drafts[id]=event.target.value.slice(0,2000);persist();}});
  $('#configImport').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>256000)throw Error('配置文件过大。');model=validateConfig(JSON.parse(await file.text()));persist();render();toast('配置已导入。');}catch(error){toast('导入失败：'+error.message);}finally{event.target.value='';}});
  document.addEventListener('keyup',event=>leisure.key(event));
  document.addEventListener('keydown',event=>{if(leisure.key(event))return;if(event.key==='Escape')return back();if($('#packetModal').hidden)return;if(event.key==='Tab'){const nodes=[...$('#packetModal').querySelectorAll('button,textarea')],first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
  let swipe=null;
  $('#screen').addEventListener('pointerdown',event=>{if(view.page!=='lock' || event.target.closest('.stp-lock-notifications'))return;swipe={y:event.clientY,x:event.clientX};});
  $('#screen').addEventListener('pointerup',event=>{if(!swipe || view.page!=='lock')return;const dy=swipe.y-event.clientY,dx=Math.abs(swipe.x-event.clientX);swipe=null;if(dy>65 && dx<100)unlock();});
  $('#screen').addEventListener('pointercancel',()=>swipe=null);
  // 图片从固定提交外链加载；单图失败后依次切换公开CDN与GitHub原文件。
  document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement)retryImage(event.target);},true);
  document.addEventListener('load',event=>{if(event.target instanceof HTMLImageElement){clearTimeout(imageTimers.get(event.target));event.target.classList.remove('stp-image-retrying');}},true);
  render();
})();
</script>
</body></html>
