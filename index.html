<body>
<main class="stp-stage">
  <aside class="stp-intro"><span class="stp-kicker">STARLIGHT APARTMENT</span><h1>一部手机。<br>八位新邻居。</h1><p>消息已经到了。<br>上滑解锁，看看是谁先来打招呼。</p><div class="stp-side-rule"></div><p class="stp-aside-small">从普通室友，到你选择的故事。<br>主动攻略 · 双向恋爱 · 百合旁观 · 被追求</p><p class="stp-aside-small">在「创造角色」中填写入住档案，<br>再把开局指令带入 TalkAI 对话。</p></aside>
  <section class="stp-phone" aria-label="星灯手机">
    <div class="stp-hardware" aria-hidden="true"><i></i><b></b></div>

    const map={lock:lockPage,home:homePage,chat:()=>chatPane(view.id),gallery:galleryPage,photo:photoPage,inbox:inboxPage,creator:creatorPage,settings:settingsPage,wallpaperPicker,splitPicker:splitPickerPage,split:splitPage};
    $('#screen').innerHTML=(map[view.page] || homePage)();
    const p=(view.page==='chat'?model.appWallpapers[view.id]:model.phoneWallpaper);
    $('#wallpaper').style.backgroundImage=`url("${wallpaperUrl(p)}")`;
    watchBackground($('#wallpaper'),wallpaperUrl(p));
    document.querySelectorAll('.stp-chat').forEach(el=>watchBackground(el,wallpaperUrl(model.appWallpapers[el.dataset.chat])));
    watchImages();
    $('.stp-phone').dataset.page=view.page;tick();
  }
  function tick() { const t='18:42';$('#statusTime').textContent=t;document.querySelectorAll('.stp-live-clock').forEach(el=>el.textContent=t); }
  function collectProfile() {
    const form=$('#creatorForm');if(!form || !form.reportValidity()) return null;
    const values=new FormData(form);return {name:String(values.get('name')||'').trim().slice(0,24),pronouns:String(values.get('pronouns')||'').trim().slice(0,24)||'未提供',identity:String(values.get('identity')||'').trim().slice(0,140),mode:String(values.get('mode')),route:String(values.get('route')),first:String(values.get('first')),opening:String(values.get('opening')||'').trim().slice(0,500),adult:values.get('adult')==='on'};
  }
  function startupPacket(p) { const r=route(p.route),c=character(p.first);return `[星灯开局]\n线路=${p.route}（${r.name.replace(/^. · /,'')}）\n用户主动攻略=${r.user?'允许':'不主动'}；AI娘主动攻略用户=${r.ai?'允许':'不允许'}\nAI娘之间百合=允许自主发展\n称呼=${p.name}\n代词或性别=${p.pronouns}\n年龄身份=成年人\n身份与爱好=${p.identity||'未提供'}\n画法=${p.mode==='adult'?'成年比例版':'Q版'}\n首个联系对象=${c.name}\n初始情境=入住第1天傍晚，我的手机收到八位居民的普通迎新消息。承接${c.name}的迎新私聊。\n我的第一条消息：${p.opening||'你好。'}\n请先确认线路，再接续真实剧情。不要替我决定动作和感情，也不要让所有居民开局就爱上我。`;
  }
  function showPacket(text,title='带入 TalkAI 对话') { lastFocus=document.activeElement;$('#packetTitle').textContent=title;$('#packetText').value=text;$('#copyStatus').textContent='';$('#packetModal').hidden=false;$('#packetText').focus();$('#packetText').setSelectionRange(0,0); }
  function closePacket() { $('#packetModal').hidden=true;if(lastFocus?.isConnected)lastFocus.focus(); }
  async function copyPacket() {
    const field=$('#packetText');let copied=false;
    if(navigator.clipboard?.writeText) try {await navigator.clipboard.writeText(field.value);copied=true;} catch(error) {copied=false;}
    if(!copied) {field.focus();field.select();try{copied=document.execCommand('copy');}catch(error){copied=false;}}
    $('#copyStatus').textContent=copied?'已复制。回到 TalkAI 输入框粘贴并发送即可。':'自动复制受浏览器限制。文字已选中，长按或按 Ctrl+C 复制。';
  }
  function prepareChat(id) { const text=model.drafts[id].trim();if(!text){toast('先写下想对她说的话。');return;}if(!route(model.profile.route) || !model.profile.name){toast('先创建你的入住角色，选择故事线。');model.profile.first=id;persist();navigate({page:'creator'});return;}showPacket(`[星灯私聊]\n对象=${character(id).name}\n玩家称呼=${model.profile.name}\n界面所选线路=${model.profile.route}；已有剧情沿用已确认线路，勿因这条私聊偷偷切线。\n我的消息：${text}\n请仅让这位居民回应；其余人不会自动知道私聊。`,'给'+character(id).label+'的聊天指令'); }
  function exportConfig() { const file=new Blob([JSON.stringify(model,null,2)],{type:'application/json'}),url=URL.createObjectURL(file),link=document.createElement('a');link.href=url;link.download='星灯手机配置.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('手机配置已导出。'); }
  document.addEventListener('click',event=>{
    const button=event.target.closest('[data-action]');if(!button || button.disabled)return;
    const action=button.dataset.action,id=button.dataset.id;
    if(action==='back')return back();if(action==='home')return home();
    if(action==='unlock')return unlock();if(action==='unlockChat')return unlock(id);
    if(action==='chat')return openChat(id);
    if(action==='gallery')return navigate({page:'gallery',id,mode:'adult'});
    if(action==='galleryMode'){view.mode=button.dataset.mode;return render();}
    if(action==='photo')return navigate({page:'photo',id,mode:button.dataset.mode,pose:button.dataset.pose});
    if(action==='setPhoneWallpaper'){model.phoneWallpaper=selection(view.id,view.mode,view.pose);persist();render();return toast('已设为手机锁屏与桌面壁纸。');}
    if(action==='setAppWallpaper'){model.appWallpapers[view.id]=selection(view.id,view.mode,view.pose);persist();return toast('已更换'+character(view.id).label+'聊天壁纸。');}
    if(action==='showImageUrl')return showPacket(cg(view.id,view.mode,view.pose),'公开原图地址');
    if(['inbox','settings','creator','wallpaperPicker'].includes(action))return navigate({page:action});
    if(action==='lock'){history=[];return navigate({page:'lock'},false);}
    if(action==='splitPicker'){if(view.page==='lock')return toast('先解锁手机，再打开分屏。');splitChoices=view.page==='split'?[view.top,view.bottom]:[];return navigate({page:'splitPicker'});}
    if(action==='pickSplit'){if(splitChoices.includes(id))splitChoices=splitChoices.filter(x=>x!==id);else if(splitChoices.length<2)splitChoices.push(id);else return toast('最多两个应用，先取消一个再选择。');return render();}
    if(action==='startSplit' && splitChoices.length===2){for(const cid of splitChoices){model.read=[...new Set([...model.read,cid])];model.recent=[cid,...model.recent.filter(x=>x!==cid)].slice(0,8);}persist();return navigate({page:'split',top:splitChoices[0],bottom:splitChoices[1]});}
    if(action==='swapSplit'){[view.top,view.bottom]=[view.bottom,view.top];return render();}
    if(action==='copyPacket')return copyPacket();if(action==='closePacket')return closePacket();
    if(action==='exportConfig')return exportConfig();if(action==='importConfig')return $('#configImport').click();
    if(action==='switchRoute'){const p=collectProfile();if(!p)return;model.profile=p;persist();return showPacket(`[星灯切线]\n线路=${p.route}（${route(p.route).name}）\n保留已发生的关系、拒绝与承诺。请确认新的主动权限；若切百合旁观线，先和我商量原有恋爱如何处理。`,'切换故事线');}
  });
  document.addEventListener('submit',event=>{const form=event.target;if(!form.matches('[data-form]'))return;event.preventDefault();if(form.dataset.form==='chat')return prepareChat(form.dataset.id);if(form.dataset.form==='creator'){const p=collectProfile();if(!p || !p.name || !route(p.route))return;model.profile=p;persist();showPacket(startupPacket(p),'入住开局指令');}});
  document.addEventListener('input',event=>{const id=event.target.dataset.draft;if(ids.includes(id)){model.drafts[id]=event.target.value.slice(0,2000);persist();}});
  $('#configImport').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>256000)throw Error('配置文件过大。');model=validateConfig(JSON.parse(await file.text()));persist();render();toast('配置已导入。');}catch(error){toast('导入失败：'+error.message);}finally{event.target.value='';}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')return back();if($('#packetModal').hidden)return;if(event.key==='Tab'){const nodes=[...$('#packetModal').querySelectorAll('button,textarea')],first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
  let swipe=null;
  $('#screen').addEventListener('pointerdown',event=>{if(view.page!=='lock' || event.target.closest('.stp-lock-notifications'))return;swipe={y:event.clientY,x:event.clientX};});
  $('#screen').addEventListener('pointerup',event=>{if(!swipe || view.page!=='lock')return;const dy=swipe.y-event.clientY,dx=Math.abs(swipe.x-event.clientX);swipe=null;if(dy>65 && dx<100)unlock();});
  $('#screen').addEventListener('pointercancel',()=>swipe=null);
  // 图片从固定提交外链加载；单图失败后依次切换公开CDN与GitHub原文件。
  document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement)retryImage(event.target);},true);
  document.addEventListener('load',event=>{if(event.target instanceof HTMLImageElement){clearTimeout(imageTimers.get(event.target));event.target.classList.remove('stp-image-retrying');}},true);
  render();
})();
</script>
</body></html>
